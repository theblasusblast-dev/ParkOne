# ParkOne completo con un solo comando:   docker compose up -d --build
#   Aplicación:     http://localhost:8080
#   API y Swagger:  http://localhost:4000/docs
#
# Durante el desarrollo se levanta solo la base de datos:   docker compose up -d db
name: parkone

services:
  db:
    image: postgres:16-alpine
    container_name: parkone-db
    restart: unless-stopped
    environment:
      # Los valores salen del archivo .env de la raíz (ver .env.example).
      # La sintaxis :? detiene Docker con un mensaje claro si falta alguno.
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
    ports:
      - "${POSTGRES_PORT:?Falta POSTGRES_PORT en .env}:5432"
    volumes:
      - parkone-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: parkone-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: http://localhost:8080
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      JWT_EXPIRES_HOURS: 8
      PLATE_CONFIDENCE_THRESHOLD: 0.8
    ports:
      - "4000:4000"

  web:
    build: ./frontend
    container_name: parkone-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  parkone-db-data:
